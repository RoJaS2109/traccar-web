services:
  database:
    image: postgres:16-alpine
    container_name: rudatrak-database
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - POSTGRES_DB=traccar
      - POSTGRES_USER=traccar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /mnt/datos/servicios/rudatrak/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 5

  traccar:
    build:
      context: .
    image: rudatrak:latest
    pull_policy: never
    container_name: rudatrak-traccar
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - proxy
    ports:
      - "5031:5031/udp"
    volumes:
      - /mnt/datos/servicios/rudatrak/trak-conf:/opt/traccar/conf
      - /mnt/datos/servicios/rudatrak/trak-poi:/opt/traccar/web/poi
      - /mnt/datos/servicios/rudatrak/trak-logs:/opt/traccar/logs
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - "EVENT_FORWARD_HEADER=Authorization: Bearer ${WEBHOOK_TOKEN}"
      - DATABASE_DRIVER=org.postgresql.Driver
      - DATABASE_URL=jdbc:postgresql://database:5432/traccar
      - DATABASE_USER=traccar
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

  carga-poi:
    build:
      context: ./tools/carga-poi
    image: carga-poi:latest
    pull_policy: never
    container_name: rudatrak-carga-poi
    restart: unless-stopped
    ports:
      - "3007:3007"
    networks:
      - proxy
    volumes:
      - /mnt/datos/servicios/rudatrak/trak-poi:/data/kml
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - KML_PATH=/data/kml/general.kml

  redis:
    image: redis:7-alpine
    container_name: rudatrak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - proxy
    volumes:
      - /mnt/datos/servicios/rudatrak/redis-data:/data
    command: redis-server --appendonly yes
    environment:
      - TZ=America/Argentina/Buenos_Aires

  ollama:
    image: ollama/ollama:latest
    container_name: rudatrak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - proxy
    volumes:
      - /mnt/datos/servicios/rudatrak/ollama:/root/.ollama
    environment:
      - TZ=America/Argentina/Buenos_Aires

  agente-ia:
    build:
      context: ./tools/agente-ia
    image: agente-ia:latest
    pull_policy: never
    container_name: rudatrak-agente-ia
    restart: unless-stopped
    ports:
      - "3008:3008"
    networks:
      - proxy
    depends_on:
      - traccar
      - redis
      - ollama
    volumes:
      - /mnt/datos/servicios/rudatrak/agente-ia-logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - TRACCAR_API_URL=http://rudatrak-traccar:8082
      - TRACCAR_USERNAME=admin
      - TRACCAR_PASSWORD=${TRACCAR_PASSWORD}
      - REDIS_URL=redis://rudatrak-redis:6379
      - OLLAMA_URL=http://rudatrak-ollama:11434
      - OLLAMA_ENABLED=false
      - SERVER_URL=https://mh.rudatrak.com
      - LOG_PATH=/app/logs
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: rudatrak-autoheal
    restart: always
    networks:
      - proxy
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    name: npm_proxy-network
    external: true
