services:
  traccar:
    build:
      context: .
    image: rudatrak:latest
    pull_policy: never
    container_name: rudatrak-traccar
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "5031:5031/udp"
    volumes:
      - /data/compose/rudatrak/trak-data:/opt/traccar/data
      - /data/compose/rudatrak/trak-conf:/opt/traccar/conf
      - /data/compose/rudatrak/trak-poi:/opt/traccar/web/poi
      - /data/compose/rudatrak/trak-logs:/opt/traccar/logs
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - "EVENT_FORWARD_HEADER=Authorization: Bearer ${WEBHOOK_TOKEN}"

  carga-poi:
    build:
      context: ./tools/carga-poi
    image: carga-poi:latest
    pull_policy: never
    container_name: rudatrak-carga-poi
    restart: unless-stopped
    ports:
      - "3007:3007"
    networks:
      - proxy
    volumes:
      - /data/compose/rudatrak/trak-poi:/data/kml
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - KML_PATH=/data/kml/general.kml

  redis:
    image: redis:7-alpine
    container_name: rudatrak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - proxy
    volumes:
      - /data/compose/rudatrak/redis-data:/data
    command: redis-server --appendonly yes
    environment:
      - TZ=America/Argentina/Buenos_Aires

  ollama:
    image: ollama/ollama:latest
    container_name: rudatrak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - proxy
    volumes:
      - /data/compose/rudatrak/ollama:/root/.ollama
    environment:
      - TZ=America/Argentina/Buenos_Aires

  agente-ia:
    build:
      context: ./tools/agente-ia
    image: agente-ia:latest
    pull_policy: never
    container_name: rudatrak-agente-ia
    restart: unless-stopped
    ports:
      - "3008:3008"
    networks:
      - proxy
    depends_on:
      - traccar
      - redis
      - ollama
    volumes:
      - /data/compose/rudatrak/agente-ia-logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - TRACCAR_API_URL=http://rudatrak-traccar:8082
      - TRACCAR_USERNAME=admin
      - TRACCAR_PASSWORD=${TRACCAR_PASSWORD}
      - REDIS_URL=redis://rudatrak-redis:6379
      - OLLAMA_URL=http://rudatrak-ollama:11434
      - OLLAMA_ENABLED=false
      - SERVER_URL=https://mh.rudatrak.com
      - LOG_PATH=/app/logs
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}

networks:
  proxy:
    name: npm_proxy-network
    external: true
